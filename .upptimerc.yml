owner: safwatech
repo: payhub-status

sites:
  - name: PayHub App
    url: https://app.payhub.ly/
    expectedStatusCodes: [200]
    icon: https://cdn.jsdelivr.net/gh/safwatech/payhub-status@main/assets/icon.png
    maxRetries: 3

  - name: PayHub API
    url: https://app.payhub.ly/v1/health
    expectedStatusCodes: [200]
    maxRetries: 3

  - name: PayHub Liveness
    url: https://app.payhub.ly/healthz
    expectedStatusCodes: [200]
    maxRetries: 3

  - name: PayHub Marketing
    url: https://payhub.ly/
    expectedStatusCodes: [200]
    maxRetries: 3

status-website:
  cname: status.payhub.ly
  logoUrl: https://cdn.jsdelivr.net/gh/safwatech/payhub-status@main/assets/icon.png
  # Custom CSS injected into <head> by @upptime/status-page; jsDelivr serves
  # our committed file with the correct text/css MIME type (raw.githubusercontent
  # serves text/plain, which most browsers refuse to apply as a stylesheet).
  css:
    - https://cdn.jsdelivr.net/gh/safwatech/payhub-status@main/global.css
  name: PayHub
  introTitle: PayHub status
  introMessage: |
    Real-time and 90-day historical uptime for PayHub's customer-facing
    surfaces. Probes run every 5 minutes from GitHub Actions runners in
    North America and Europe; operator dashboards live behind admin SSO.
  navbar:
    - title: Status
      href: /
    - title: PayHub.ly
      href: https://payhub.ly/
    - title: Docs
      href: https://docs.payhub.ly/
  workflowSchedule:
    graphs: "0 0 * * *"
    responseTime: "0 23 * * *"
    staticSite: "0 1 * * *"
    summary: "0 18 * * SAT"

notifications:
  - type: github
